name = "hex-conway"
defaultTargets = ["HexConway"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexBerlekamp"
git = "https://github.com/leanprover/hex-berlekamp.git"
rev = "v0.2.0"

[[require]]
name = "HexArith"
git = "https://github.com/leanprover/hex-arith.git"
rev = "v0.2.0"

[[require]]
name = "HexPolyFp"
git = "https://github.com/leanprover/hex-poly-fp.git"
rev = "v0.2.0"

[[require]]
name = "HexGFqRing"
git = "https://github.com/leanprover/hex-gfq-ring.git"
rev = "v0.2.0"

[[require]]
name = "HexPrimality"
git = "https://github.com/leanprover/hex-primality.git"
rev = "v0.2.0"

[[lean_lib]]
name = "HexConway"
